<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>0x2F</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* 0x2F Web — a workstation ledger.
     #2F2F2F is the canonical graphite: it is the chrome, the ink, and the
     rule under the execution track. "/" is structural notation (the task
     gutter, the runtime path in the chrome), never decoration. */
  /* Ledger column geometry. The header and the rows are separate layouts, so
     the ONLY way they stay in one grid is by sharing these. Never hard-code a
     column width or the row gap again — they drift silently. */
  :root { --col-exec: 170px; --col-state: 78px; --col-gap: 20px; }

  html, body { margin: 0; height: 100%; background: #e4e8ec; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #2f2f2f;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  input::placeholder { color: #8f9aa4; }
  ::selection { background: #cddcf5; color: #2f2f2f; }

  @keyframes wk-halt { 0%, 100% { opacity: 1 } 45% { opacity: .3 } }
  @keyframes wk-in { from { opacity: 0; transform: translateY(-3px) } to { opacity: 1; transform: none } }
  @keyframes wk-live { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }

  #shell { height: 100vh; display: flex; flex-direction: column; background: #e4e8ec; }

  /* chrome */
  .chrome { flex: none; background: #2f2f2f; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(21,21,21,.5); }
  .chrome-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: stretch; justify-content: space-between; height: 60px; padding: 0 32px; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-mark { font-size: 15.5px; letter-spacing: .02em; color: #f4f6f8; font-weight: 500; }
  .brand-slash { font-size: 15.5px; color: #79838c; }
  .brand-scope { font-size: 11px; letter-spacing: .22em; color: #c3ccd3; }
  .chrome-div { width: 1px; height: 22px; background: rgba(255,255,255,.16); display: block; margin-left: 3px; }
  .runtime { display: flex; align-items: center; gap: 9px; }
  .runtime-label { font-size: 10px; letter-spacing: .16em; color: #9aa6b0; }
  .runtime-dot { width: 6px; height: 6px; background: #5fd0a0; display: block; animation: wk-live 2.4s ease-in-out infinite; }
  .runtime-dot.off { background: #b8532a; animation: none; }
  .runtime-host { font-size: 12.5px; color: #dde4e9; }
  .counters { display: flex; align-items: stretch; }
  .counter { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 0 20px; border-left: 1px solid rgba(255,255,255,.14); min-width: 104px; }
  .counter:last-child { padding-right: 0; min-width: 96px; }
  .counter-n { font-size: 18px; line-height: 1; color: #f2f5f7; font-variant-numeric: tabular-nums; }
  .counter-k { font-size: 10px; letter-spacing: .16em; color: #a8b3bc; margin-top: 7px; white-space: nowrap; }

  /* attention settings — two controls, nothing more */
  .chrome-settings { display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .setting {
    background: none; border: 1px solid rgba(255,255,255,.16); color: #9aa6b0;
    font-family: inherit; font-size: 10px; letter-spacing: .16em;
    padding: 5px 9px; cursor: pointer; border-radius: 0; white-space: nowrap;
  }
  .setting:hover { border-color: rgba(255,255,255,.4); color: #dde4e9; }
  .setting.disabled { opacity: .38; cursor: default; }
  .setting.disabled:hover { border-color: rgba(255,255,255,.16); color: #9aa6b0; }

  /* the slash's visual trace: the "/" mark fades once (READY) or splits
     (NEEDS YOU) in step with the sound. Motion only; reduced-motion kills it. */
  @keyframes wk-slash { 0%, 100% { opacity: 1 } 28% { opacity: .22 } }
  @keyframes wk-slash-split { 0%, 100% { opacity: 1 } 10% { opacity: .22 } 24% { opacity: 1 } 38% { opacity: .22 } 52% { opacity: 1 } }
  .brand-slash.slash { animation: wk-slash .3s ease-out both; }
  .brand-slash.slash-split { animation: wk-slash-split .5s ease-out both; }

  /* sound demo — dev only, shown only with ?sound-demo=1 */
  .sound-demo { position: fixed; left: 24px; bottom: 100px; z-index: 30; display: flex; align-items: center; gap: 8px; background: #2f2f2f; color: #9aa6b0; padding: 8px 12px; box-shadow: 0 2px 14px rgba(21,21,21,.35); }
  .sound-demo-k { font-size: 10px; letter-spacing: .16em; }
  .sound-demo-btn { background: none; border: 1px solid rgba(255,255,255,.22); color: #dde4e9; font-family: inherit; font-size: 10px; letter-spacing: .14em; padding: 5px 10px; cursor: pointer; border-radius: 0; }
  .sound-demo-btn:hover { background: #2f5fa8; border-color: #2f5fa8; color: #f6f8fa; }

  @media (prefers-reduced-motion: reduce) {
    .brand-slash.slash, .brand-slash.slash-split { animation: none; }
  }

  /* ledger */
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; background: #e4e8ec; }
  .sheet { max-width: 1280px; margin: 0 auto; background: #f6f8fa; border-left: 1px solid #ccd4da; border-right: 1px solid #ccd4da; min-height: 100%; }
  .head { display: grid; grid-template-columns: 56px 1fr; border-bottom: 1px solid #2f2f2f; position: sticky; top: 0; background: #f6f8fa; z-index: 3; }
  .head-gutter { padding: 11px 12px 10px; text-align: right; font-size: 10px; letter-spacing: .16em; color: #5c6771; }
  .head-cols { border-left: 1px solid #dbe2e7; padding: 11px 24px 10px 20px; display: flex; justify-content: space-between; gap: 20px; font-size: 10px; letter-spacing: .16em; color: #5c6771; }
  .head-right { display: flex; gap: var(--col-gap); }
  .head-exec { width: var(--col-exec); text-align: left; }
  .head-state { width: var(--col-state); text-align: right; }

  .row { display: grid; grid-template-columns: 56px 1fr; }
  /* Only a task arriving in the ledger animates in. Live re-renders must
     never restart it, or every row sits permanently mid-fade. */
  .row.enter { animation: wk-in .26s ease both; }
  .row-gutter { display: flex; align-items: flex-start; justify-content: flex-end; gap: 9px; }
  .row-tick { width: 3px; height: 13px; display: block; margin-top: 3px; }
  .row-num { font-size: 12.5px; font-variant-numeric: tabular-nums; line-height: 1.35; }
  .row-body { border-left: 1px solid #dbe2e7; min-width: 0; }

  .compact { display: flex; align-items: center; gap: var(--col-gap); cursor: pointer; min-width: 0; }
  .compact:hover { background: #edf1f5; }
  .compact-title { flex: 1; min-width: 0; font-family: "Instrument Sans", system-ui, sans-serif; letter-spacing: -.011em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact-sub { font-size: 12px; flex: none; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; text-align: right; font-variant-numeric: tabular-nums; }
  .compact-mini { display: flex; align-items: flex-end; gap: 5px; height: 16px; width: var(--col-exec); justify-content: flex-start; flex: none; }
  .compact-state { font-size: 10px; letter-spacing: .15em; width: var(--col-state); text-align: right; flex: none; }

  .detail-head { display: flex; align-items: baseline; gap: 24px; cursor: pointer; min-width: 0; }
  .detail-title { flex: 1; min-width: 0; margin: 0; font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 500; letter-spacing: -.026em; line-height: 1.08; color: #2f2f2f; text-wrap: pretty; overflow-wrap: anywhere; }
  .detail-state { font-size: 10.5px; letter-spacing: .16em; flex: none; white-space: nowrap; }

  /* travel rule */
  .track-wrap { margin-top: 40px; display: inline-block; position: relative; }
  .track-wash { position: absolute; left: 0; bottom: 22px; height: 36px; pointer-events: none; }
  .track { display: flex; align-items: flex-end; gap: 14px; height: 36px; position: relative; }
  .track-group { display: flex; align-items: flex-end; gap: 2px; flex: none; }
  .track-cell { height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: none; }
  .track-cell > .fill { width: 100%; }
  /* Scaffolding for a provider that cannot report its steps: the phase frame
     stays legible, but a flat hairline can never be mistaken for activity. */
  .track-cell > .fill.unobserved { opacity: .75; }
  .track-head { height: 7px; margin-bottom: 5px; flex: none; animation: wk-live 1.8s ease-in-out infinite; }
  .track-halt { position: relative; width: 2px; height: 32px; flex: none; }
  .track-halt > span { position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); font-size: 20px; line-height: 1; animation: wk-halt 1.15s ease-in-out infinite; }
  .track-axis { height: 1px; background: #2f2f2f; opacity: .6; }
  .track-marks { position: relative; height: 6px; }
  .track-marks > span { position: absolute; top: 0; width: 1px; height: 5px; }
  .track-labels { display: flex; gap: 14px; margin-top: 5px; }
  .track-label { flex: none; font-size: 10px; letter-spacing: .16em; }
  .mini-group { display: flex; align-items: flex-end; gap: 1px; flex: none; }

  .status-line { margin-top: 24px; display: flex; align-items: baseline; gap: 18px; max-width: 860px; }
  .status-phase { font-size: 10px; letter-spacing: .16em; color: #5c6771; width: 102px; flex: none; }
  .status-arg { font-size: 14.5px; color: #2f2f2f; flex: 1; letter-spacing: -.006em; overflow-wrap: anywhere; }
  .status-node { font-size: 11.5px; color: #5c6771; flex: none; letter-spacing: .04em; text-transform: uppercase; }
  .status-div { width: 1px; height: 12px; background: #c6cfd6; flex: none; display: block; }
  .status-elapsed { font-size: 12px; color: #5c6771; flex: none; font-variant-numeric: tabular-nums; }
  /* the AUTO routing decision — quiet, inspectable, never the headline */
  .routed-line { margin-top: 10px; display: flex; align-items: baseline; gap: 10px; max-width: 860px; }
  .routed-k { font-size: 10px; letter-spacing: .16em; color: #5c6771; width: 102px; flex: none; }
  .routed-v { font-size: 11px; color: #37424c; letter-spacing: .04em; text-transform: uppercase; flex: none; }
  .routed-why { font-size: 11px; color: #5c6771; overflow-wrap: anywhere; }

  /* needs you */
  .halt-card { margin-top: 30px; padding: 26px 26px 24px; background: #e5ecf9; max-width: 860px; }
  .halt-kind { font-size: 11px; letter-spacing: .2em; font-weight: 600; }
  .halt-verb { margin-top: 18px; font-family: "Instrument Sans", system-ui, sans-serif; font-size: 17px; color: #37424c; letter-spacing: -.01em; }
  .halt-path { margin-top: 7px; font-size: 20px; color: #2f2f2f; letter-spacing: -.012em; font-weight: 500; word-break: break-all; }
  .halt-why { margin-top: 14px; font-size: 13px; color: #37424c; overflow-wrap: anywhere; }
  .halt-detail { margin-top: 16px; padding: 14px; background: #f6f8fa; border: 1px solid #c6d3ea; font-size: 12px; color: #37424c; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  /* a needs_you/decision block: the question is asked and answered, not
     allowed/rejected — the card keeps the ledger's restrained vocabulary */
  .halt-card.decision .decision-question { font-weight: 600; }
  .decision-limitation { margin-top: 12px; font-size: 12px; line-height: 1.55; color: #5c6771; max-width: 620px; }
  .decision-answer-wrap { margin-top: 16px; }
  .decision-answer { display: block; width: 100%; max-width: 620px; font-family: inherit; font-size: 13px; line-height: 1.55; color: #2f2f2f; background: #f6f8fa; border: 1px solid #c6d3ea; padding: 10px 12px; resize: vertical; border-radius: 0; outline: none; }
  .decision-answer:focus { border-color: #2f5fa8; }
  .acts { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .act { padding: 12px 26px; font-size: 11px; letter-spacing: .16em; cursor: pointer; font-weight: 500; border: 1px solid transparent; background: none; font-family: inherit; }
  .act .key { opacity: .55; }
  .act-primary { background: #2f2f2f; color: #f6f8fa; }
  .act-primary:hover { background: #2f5fa8; }
  .act-outline { border-color: #2f2f2f; color: #2f2f2f; }
  .act-outline:hover { background: #2f2f2f; color: #f6f8fa; }
  .act-quiet { border-color: #98a5af; color: #37424c; }
  .act-quiet:hover { border-color: #2f2f2f; color: #2f2f2f; }
  .act[disabled] { opacity: .45; cursor: default; }

  /* bands */
  .bands { margin-top: 34px; }
  .band { display: grid; grid-template-columns: 148px 1fr; padding: 16px 0 20px; }
  .band-label { font-size: 10px; letter-spacing: .16em; line-height: 1.6; }
  .band-meta { font-size: 11.5px; color: #5c6771; margin-top: 8px; }
  .band-left { padding-right: 20px; }
  .band-right { border-left: 1px solid #dbe2e7; padding-left: 24px; }
  .band-item { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; }
  .band-verb { width: 76px; flex: none; font-size: 10.5px; letter-spacing: .14em; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .band-arg { flex: 1; font-size: 14px; letter-spacing: -.008em; text-wrap: pretty; overflow-wrap: anywhere; }
  .band-arg.human { font-family: "Instrument Sans", system-ui, sans-serif; }
  .band-t { flex: none; font-size: 11.5px; color: #5c6771; font-variant-numeric: tabular-nums; }
  .band-pending { font-size: 13px; padding: 6px 0; }

  /* result */
  .result { border-top: 1px solid #2f2f2f; padding: 24px 0 6px; display: grid; grid-template-columns: 148px 1fr; }
  .result-k { font-size: 10px; letter-spacing: .16em; color: #2f2f2f; font-weight: 600; }
  .result-n { font-size: 26px; letter-spacing: -.03em; color: #2f2f2f; font-variant-numeric: tabular-nums; margin-top: 15px; }
  .result-n.unreported { color: #5c6771; }
  .result-n small { font-size: 11px; letter-spacing: .16em; color: #5c6771; display: block; margin-top: 6px; }
  .result-file { display: flex; justify-content: space-between; gap: 20px; padding: 6px 0; font-size: 14px; letter-spacing: -.008em; color: #2f2f2f; overflow-wrap: anywhere; }
  .result-body { margin-top: 14px; font-size: 13.5px; line-height: 1.65; color: #2f2f2f; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

  /* rich prose — a small safe Markdown subset for provider-authored text.
     Ink headings, muted rules, mono code: no links, no images, no raw HTML.
     Code blocks scroll inside the Ledger width; they never break the sheet. */
  .rich > :first-child { margin-top: 0; }
  .rich > :last-child { margin-bottom: 0; }
  .rich-p { margin: 0 0 12px; overflow-wrap: anywhere; }
  .rich-h1, .rich-h2, .rich-h3 {
    font-family: "Instrument Sans", system-ui, sans-serif;
    letter-spacing: -.012em; color: #2f2f2f; line-height: 1.25;
    margin: 22px 0 10px; overflow-wrap: anywhere;
  }
  .rich-h1 { font-size: 19px; font-weight: 600; }
  .rich-h2 { font-size: 16px; font-weight: 600; }
  .rich-h3 { font-size: 13.5px; font-weight: 600; color: #37424c; }
  .rich-bold { font-weight: 600; }
  .rich-code {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; background: #e9edf1; padding: 1px 5px; color: #37424c;
    overflow-wrap: anywhere;
  }
  /* Inside a title the switch from Instrument Sans to mono IS the signal —
     a filled chip on every ledger row would be noise, not emphasis. */
  .compact-title .rich-code,
  .detail-title .rich-code {
    background: transparent; padding: 0; color: inherit; font-size: .92em;
  }

  .rich-list { margin: 0 0 12px; }
  .rich-li { display: flex; gap: 10px; align-items: baseline; margin: 3px 0; }
  .rich-li-mark { flex: none; color: #79838c; font-variant-numeric: tabular-nums; }
  .rich-li-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .rich-pre {
    margin: 0 0 12px; padding: 12px 14px; max-width: 100%;
    background: #eef1f4; border: 1px solid #dbe2e7; overflow-x: auto;
  }
  .rich-pre code {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.55; color: #2f2f2f; white-space: pre;
    display: block;
  }

  /* run history — an instrument inside task detail, never a dashboard */
  .runs-section { margin-top: 30px; border-top: 1px solid #dbe2e7; padding-top: 20px; }
  .runs-k { font-size: 10px; letter-spacing: .16em; color: #5c6771; font-weight: 600; }
  .run-row { display: flex; align-items: baseline; gap: 22px; width: 100%; background: none; border: none; border-bottom: 1px solid #e4e8ec; padding: 10px 6px; font-family: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  .run-row:hover { background: #eef2f6; }
  .run-row.selected { background: #e9eefb; }
  .run-num { width: 30px; flex: none; font-variant-numeric: tabular-nums; }
  .run-provider { flex: 1; font-size: 11px; letter-spacing: .14em; }
  .run-duration { flex: none; color: #5c6771; font-variant-numeric: tabular-nums; }
  .run-state { flex: none; width: 88px; text-align: right; font-size: 10px; letter-spacing: .15em; }
  .run-panel { margin-top: 16px; border: 1px solid #dbe2e7; border-left: 2px solid; padding: 18px 20px 20px; background: #f6f8fa; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .compare .run-panel { margin-top: 0; }
  .run-head { display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #e4e8ec; }
  .run-head-num { font-size: 11px; letter-spacing: .16em; font-weight: 600; }
  .run-head-provider { flex: 1; font-size: 11px; letter-spacing: .16em; }
  .run-head-duration { font-variant-numeric: tabular-nums; font-size: 12px; color: #5c6771; }
  .run-head-state { font-size: 10px; letter-spacing: .15em; }
  .run-facts { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 12px 0 6px; }
  .run-fact { display: flex; gap: 8px; font-size: 11.5px; }
  .run-fact-k { color: #5c6771; }
  .run-fact-v { color: #2f2f2f; overflow-wrap: anywhere; }
  .run-sub-k { font-size: 10px; letter-spacing: .16em; color: #5c6771; margin-top: 12px; }
  .run-step { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; font-size: 12.5px; }
  .run-step-verb { width: 64px; flex: none; font-size: 10px; letter-spacing: .14em; color: #37424c; font-weight: 500; }
  .run-step-arg { flex: 1; color: #2f2f2f; overflow-wrap: anywhere; }
  .run-step-t { flex: none; color: #5c6771; font-variant-numeric: tabular-nums; font-size: 11px; }
  .run-step-quiet { padding: 6px 0; font-size: 12.5px; }
  .run-file { padding: 4px 0; font-size: 12.5px; color: #2f2f2f; overflow-wrap: anywhere; }
  .run-result-body { margin-top: 8px; font-size: 13px; line-height: 1.6; color: #2f2f2f; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }

  /* composer */
  .composer { flex: none; background: #2f2f2f; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 -1px 0 rgba(21,21,21,.5); }
  .composer-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 16px; height: 72px; }
  .composer-k { font-size: 11px; letter-spacing: .16em; color: #9aa6b0; flex: none; }
  .composer-caret { width: 9px; height: 19px; background: #2f5fa8; flex: none; box-shadow: 0 0 8px #2f5fa870; }
  .composer input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: inherit; font-size: 18px; letter-spacing: -.02em; color: #f2f5f7; caret-color: #2f5fa8; }
  /* Provider choice is secondary — a quiet native select next to the caret.
     Unavailable providers show a "UNAVAILABLE" suffix and are disabled, so
     the select needs a little more room than the plain ids did. */
  .composer select {
    flex: none; max-width: 210px; border: 1px solid rgba(255,255,255,.18);
    background: #2f2f2f; color: #c3ccd3; font-family: inherit;
    font-size: 10.5px; letter-spacing: .14em; padding: 6px 6px; outline: none;
    cursor: pointer; border-radius: 0;
  }
  .composer select:hover { border-color: rgba(255,255,255,.34); }
  .composer select option { background: #2f2f2f; color: #dde4e9; }
  .composer-hint { font-size: 10px; letter-spacing: .16em; flex: none; white-space: nowrap; color: #9aa6b0; }
  .composer-hint.armed { color: #2f5fa8; }
  .legend { border-top: 1px solid rgba(255,255,255,.12); }
  .legend-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 22px; height: 30px; font-size: 10px; letter-spacing: .13em; color: #9aa6b0; overflow: hidden; white-space: nowrap; }
  .legend-adapter { margin-left: auto; color: #7d8892; }

  .empty { padding: 60px 24px 60px 20px; border-left: 1px solid #dbe2e7; color: #5c6771; font-size: 13px; letter-spacing: .04em; }
  .flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: 118px; background: #b8532a; color: #f6f8fa; padding: 10px 20px; font-size: 11px; letter-spacing: .14em; z-index: 20; }

  @media (max-width: 1179px) {
    .chrome-inner, .composer-inner, .legend-inner { padding: 0 18px; }
    .head, .row { grid-template-columns: 44px 1fr; }
    .band, .result { grid-template-columns: 112px 1fr; }
    :root { --col-exec: 120px; }
    .compact-sub { display: none; }
  }
