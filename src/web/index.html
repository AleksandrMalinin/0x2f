<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>0x2F</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* 0x2F Web — a workstation ledger.
     #2F2F2F is the canonical graphite: it is the chrome, the ink, and the
     rule under the execution track. "/" is structural notation (the task
     gutter, the runtime path in the chrome), never decoration. */
  html, body { margin: 0; height: 100%; background: #e4e8ec; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #2f2f2f;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  input::placeholder { color: #8f9aa4; }
  ::selection { background: #cddcf5; color: #2f2f2f; }

  @keyframes wk-halt { 0%, 100% { opacity: 1 } 45% { opacity: .3 } }
  @keyframes wk-in { from { opacity: 0; transform: translateY(-3px) } to { opacity: 1; transform: none } }
  @keyframes wk-live { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }

  #shell { height: 100vh; display: flex; flex-direction: column; background: #e4e8ec; }

  /* chrome */
  .chrome { flex: none; background: #2f2f2f; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(21,21,21,.5); }
  .chrome-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: stretch; justify-content: space-between; height: 60px; padding: 0 32px; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-mark { font-size: 15.5px; letter-spacing: .02em; color: #f4f6f8; font-weight: 500; }
  .brand-slash { font-size: 15.5px; color: #79838c; }
  .brand-scope { font-size: 11px; letter-spacing: .22em; color: #c3ccd3; }
  .chrome-div { width: 1px; height: 22px; background: rgba(255,255,255,.16); display: block; margin-left: 3px; }
  .runtime { display: flex; align-items: center; gap: 9px; }
  .runtime-label { font-size: 10px; letter-spacing: .16em; color: #9aa6b0; }
  .runtime-dot { width: 6px; height: 6px; background: #5fd0a0; display: block; animation: wk-live 2.4s ease-in-out infinite; }
  .runtime-dot.off { background: #b8532a; animation: none; }
  .runtime-host { font-size: 12.5px; color: #dde4e9; }
  .counters { display: flex; align-items: stretch; }
  .counter { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 0 20px; border-left: 1px solid rgba(255,255,255,.14); min-width: 104px; }
  .counter:last-child { padding-right: 0; min-width: 96px; }
  .counter-n { font-size: 18px; line-height: 1; color: #f2f5f7; font-variant-numeric: tabular-nums; }
  .counter-k { font-size: 10px; letter-spacing: .16em; color: #a8b3bc; margin-top: 7px; white-space: nowrap; }

  /* ledger */
  .scroll { flex: 1; overflow-y: auto; background: #e4e8ec; }
  .sheet { max-width: 1280px; margin: 0 auto; background: #f6f8fa; border-left: 1px solid #ccd4da; border-right: 1px solid #ccd4da; min-height: 100%; }
  .head { display: grid; grid-template-columns: 56px 1fr; border-bottom: 1px solid #2f2f2f; position: sticky; top: 0; background: #f6f8fa; z-index: 3; }
  .head-gutter { padding: 11px 12px 10px; text-align: right; font-size: 10px; letter-spacing: .16em; color: #5c6771; }
  .head-cols { border-left: 1px solid #dbe2e7; padding: 11px 24px 10px 20px; display: flex; justify-content: space-between; gap: 20px; font-size: 10px; letter-spacing: .16em; color: #5c6771; }
  .head-right { display: flex; gap: 0; }
  .head-exec { width: 170px; text-align: left; }
  .head-state { width: 78px; text-align: right; }

  .row { display: grid; grid-template-columns: 56px 1fr; }
  /* Only a task arriving in the ledger animates in. Live re-renders must
     never restart it, or every row sits permanently mid-fade. */
  .row.enter { animation: wk-in .26s ease both; }
  .row-gutter { display: flex; align-items: flex-start; justify-content: flex-end; gap: 9px; }
  .row-tick { width: 3px; height: 13px; display: block; margin-top: 3px; }
  .row-num { font-size: 12.5px; font-variant-numeric: tabular-nums; line-height: 1.35; }
  .row-body { border-left: 1px solid #dbe2e7; }

  .compact { display: flex; align-items: center; gap: 20px; cursor: pointer; }
  .compact:hover { background: #edf1f5; }
  .compact-title { flex: 1; font-family: "Instrument Sans", system-ui, sans-serif; letter-spacing: -.011em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact-sub { font-size: 12px; flex: none; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .compact-mini { display: flex; align-items: flex-end; gap: 5px; height: 16px; width: 170px; justify-content: flex-start; flex: none; }
  .compact-state { font-size: 10px; letter-spacing: .15em; width: 78px; text-align: right; flex: none; }

  .detail-head { display: flex; align-items: baseline; gap: 24px; cursor: pointer; }
  .detail-title { flex: 1; margin: 0; font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 500; letter-spacing: -.026em; line-height: 1.08; color: #2f2f2f; text-wrap: pretty; }
  .detail-state { font-size: 10.5px; letter-spacing: .16em; flex: none; white-space: nowrap; }

  /* travel rule */
  .track-wrap { margin-top: 40px; display: inline-block; position: relative; }
  .track-wash { position: absolute; left: 0; bottom: 22px; height: 36px; pointer-events: none; }
  .track { display: flex; align-items: flex-end; gap: 14px; height: 36px; position: relative; }
  .track-group { display: flex; align-items: flex-end; gap: 2px; flex: none; }
  .track-cell { height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: none; }
  .track-cell > .fill { width: 100%; }
  .track-head { height: 7px; margin-bottom: 5px; flex: none; animation: wk-live 1.8s ease-in-out infinite; }
  .track-halt { position: relative; width: 2px; height: 32px; flex: none; }
  .track-halt > span { position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); font-size: 20px; line-height: 1; animation: wk-halt 1.15s ease-in-out infinite; }
  .track-axis { height: 1px; background: #2f2f2f; opacity: .6; }
  .track-marks { position: relative; height: 6px; }
  .track-marks > span { position: absolute; top: 0; width: 1px; height: 5px; }
  .track-labels { display: flex; gap: 14px; margin-top: 5px; }
  .track-label { flex: none; font-size: 10px; letter-spacing: .16em; }
  .mini-group { display: flex; align-items: flex-end; gap: 1px; flex: none; }

  .status-line { margin-top: 24px; display: flex; align-items: baseline; gap: 18px; max-width: 860px; }
  .status-phase { font-size: 10px; letter-spacing: .16em; color: #5c6771; width: 102px; flex: none; }
  .status-arg { font-size: 14.5px; color: #2f2f2f; flex: 1; letter-spacing: -.006em; overflow-wrap: anywhere; }
  .status-node { font-size: 11.5px; color: #5c6771; flex: none; letter-spacing: .04em; text-transform: uppercase; }
  .status-div { width: 1px; height: 12px; background: #c6cfd6; flex: none; display: block; }
  .status-elapsed { font-size: 12px; color: #5c6771; flex: none; font-variant-numeric: tabular-nums; }

  /* needs you */
  .halt-card { margin-top: 30px; padding: 26px 26px 24px; background: #e5ecf9; max-width: 860px; }
  .halt-kind { font-size: 11px; letter-spacing: .2em; font-weight: 600; }
  .halt-verb { margin-top: 18px; font-family: "Instrument Sans", system-ui, sans-serif; font-size: 17px; color: #37424c; letter-spacing: -.01em; }
  .halt-path { margin-top: 7px; font-size: 20px; color: #2f2f2f; letter-spacing: -.012em; font-weight: 500; word-break: break-all; }
  .halt-why { margin-top: 14px; font-size: 13px; color: #37424c; overflow-wrap: anywhere; }
  .halt-detail { margin-top: 16px; padding: 14px; background: #f6f8fa; border: 1px solid #c6d3ea; font-size: 12px; color: #37424c; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  .acts { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .act { padding: 12px 26px; font-size: 11px; letter-spacing: .16em; cursor: pointer; font-weight: 500; border: 1px solid transparent; background: none; font-family: inherit; }
  .act .key { opacity: .55; }
  .act-primary { background: #2f2f2f; color: #f6f8fa; }
  .act-primary:hover { background: #2f5fa8; }
  .act-outline { border-color: #2f2f2f; color: #2f2f2f; }
  .act-outline:hover { background: #2f2f2f; color: #f6f8fa; }
  .act-quiet { border-color: #98a5af; color: #37424c; }
  .act-quiet:hover { border-color: #2f2f2f; color: #2f2f2f; }
  .act[disabled] { opacity: .45; cursor: default; }

  /* bands */
  .bands { margin-top: 34px; }
  .band { display: grid; grid-template-columns: 148px 1fr; padding: 16px 0 20px; }
  .band-label { font-size: 10px; letter-spacing: .16em; line-height: 1.6; }
  .band-meta { font-size: 11.5px; color: #5c6771; margin-top: 8px; }
  .band-left { padding-right: 20px; }
  .band-right { border-left: 1px solid #dbe2e7; padding-left: 24px; }
  .band-item { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; }
  .band-verb { width: 76px; flex: none; font-size: 10.5px; letter-spacing: .14em; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .band-arg { flex: 1; font-size: 14px; letter-spacing: -.008em; text-wrap: pretty; overflow-wrap: anywhere; }
  .band-arg.human { font-family: "Instrument Sans", system-ui, sans-serif; }
  .band-t { flex: none; font-size: 11.5px; color: #5c6771; font-variant-numeric: tabular-nums; }
  .band-pending { font-size: 13px; padding: 6px 0; }

  /* result */
  .result { border-top: 1px solid #2f2f2f; padding: 24px 0 6px; display: grid; grid-template-columns: 148px 1fr; }
  .result-k { font-size: 10px; letter-spacing: .16em; color: #2f2f2f; font-weight: 600; }
  .result-n { font-size: 26px; letter-spacing: -.03em; color: #2f2f2f; font-variant-numeric: tabular-nums; margin-top: 15px; }
  .result-n small { font-size: 11px; letter-spacing: .16em; color: #5c6771; display: block; margin-top: 6px; }
  .result-file { display: flex; justify-content: space-between; gap: 20px; padding: 6px 0; font-size: 14px; letter-spacing: -.008em; color: #2f2f2f; overflow-wrap: anywhere; }
  .result-body { margin-top: 14px; font-size: 13.5px; line-height: 1.65; color: #2f2f2f; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

  /* composer */
  .composer { flex: none; background: #2f2f2f; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 -1px 0 rgba(21,21,21,.5); }
  .composer-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 16px; height: 72px; }
  .composer-k { font-size: 11px; letter-spacing: .16em; color: #9aa6b0; flex: none; }
  .composer-caret { width: 9px; height: 19px; background: #2f5fa8; flex: none; box-shadow: 0 0 8px #2f5fa870; }
  .composer input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: inherit; font-size: 18px; letter-spacing: -.02em; color: #f2f5f7; caret-color: #2f5fa8; }
  .composer-hint { font-size: 10px; letter-spacing: .16em; flex: none; white-space: nowrap; color: #9aa6b0; }
  .composer-hint.armed { color: #2f5fa8; }
  .legend { border-top: 1px solid rgba(255,255,255,.12); }
  .legend-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 22px; height: 30px; font-size: 10px; letter-spacing: .13em; color: #9aa6b0; overflow: hidden; white-space: nowrap; }
  .legend-adapter { margin-left: auto; color: #7d8892; }

  .empty { padding: 60px 24px 60px 20px; border-left: 1px solid #dbe2e7; color: #5c6771; font-size: 13px; letter-spacing: .04em; }
  .flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: 118px; background: #b8532a; color: #f6f8fa; padding: 10px 20px; font-size: 11px; letter-spacing: .14em; z-index: 20; }

  @media (max-width: 1179px) {
    .chrome-inner, .composer-inner, .legend-inner { padding: 0 18px; }
    .head-cols { padding: 11px 20px 10px 18px; }
    .head, .row { grid-template-columns: 44px 1fr; }
    .band, .result { grid-template-columns: 112px 1fr; }
    .head-exec, .compact-mini { width: 120px; }
    .compact-sub { display: none; }
  }
  @media (max-width: 899px) {
    .head-exec, .compact-mini { display: none; }
    .counter.clock, .legend-adapter { display: none; }
  }
</style>
</head>
<body>
<div id="shell"></div>
<script type="module" src="/app/app.js"></script>
</body>
</html>
